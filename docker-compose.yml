version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stitchflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stitchflow
      POSTGRES_PASSWORD: stitchflow_dev_password
      POSTGRES_DB: stitchflow
    ports:
      - '5432:5432'
    volumes:
      - stitchflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stitchflow']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stitchflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stitchflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - stitchflow-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  stitchflow-pg-data:
  stitchflow-pgadmin-data:
